name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Install Python (via uv)
        run: uv python install
        
      - name: Verify build can succeed
        run: uv build